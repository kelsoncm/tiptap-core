name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Criar release e publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Conferir versão da tag
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME difere da versão do package.json ($PKG)."
            exit 1
          fi
      - run: npm pack
      # The tarball on the release is installable without the npm registry:
      # npm install https://github.com/kelsoncm/tiptap-core/releases/download/vX.Y.Z/kelsoncm-tiptap-core-X.Y.Z.tgz
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: '*.tgz'
      # npm publishing only when a token is configured (trusted publishing can replace it later).
      - name: Publicar no npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
