version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # TypeScript 7 não é suportado por typescript-eslint (<6.1) nem pelo Angular 22 (>=6.0 <6.1).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @tiptap/extension-mathematics aceita katex ^0.16.4 || ^0.17.0 || ^0.18.0.
      - dependency-name: katex
        versions: ['>=0.19.0']
    schedule:
      interval: weekly
    groups:
      tiptap:
        patterns: ['@tiptap/*']
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ['@tiptap/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
