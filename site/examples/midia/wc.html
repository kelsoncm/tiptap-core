<kelsoncm-tiptap id="noticia" name="noticia" toolbar="full"></kelsoncm-tiptap>

<script type="module">
  document.querySelector('#noticia').options = {
    media: {
      upload: async (file) => {
        const body = new FormData();
        body.append('file', file);
        const response = await fetch('/api/upload', { method: 'POST', body });
        return (await response.json()).url; // URL pública da imagem
      },
      gallery: async () => (await fetch('/api/imagens')).json(), // [{ src, alt }]
      embedHosts: ['youtube.com', 'player.vimeo.com'],
      maxFileSize: 2 * 1024 * 1024,
    },
  };
</script>
