<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tiptap-core demo</title>
    <style>
      body {
        max-width: 960px;
        margin: 24px auto;
        padding: 0 16px;
        font-family: system-ui, sans-serif;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0;
        align-items: center;
      }
      #host {
        margin-top: 56px;
      }
      pre {
        white-space: pre-wrap;
        background: #f6f6f6;
        padding: 8px;
        font-size: 12px;
      }
      #out {
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>@kelsoncm/tiptap-core</h1>
    <div class="controls">
      <label
        >Modo
        <select id="mode">
          <option>toolbar</option>
          <option>balloon</option>
          <option>inline</option>
          <option>notion</option>
          <option>readonly</option>
        </select>
      </label>
      <label
        >Idioma
        <select id="locale">
          <option>pt-BR</option>
          <option>en</option>
          <option>es</option>
        </select>
      </label>
      <label><input type="checkbox" id="restricted" /> Edição restrita</label>
      <button type="button" id="region">Marcar região editável</button>
    </div>
    <div id="host"></div>
    <h2>HTML</h2>
    <pre id="out"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
